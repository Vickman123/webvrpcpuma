<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Experiencia WebXR - PC PUMA</title>
    <link rel="stylesheet" href="src/styles.css">
    <!-- Import map para resolver dependencias sin bundler -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>
    <div id="ui-container">
        <h1>EXPERIENCIA INTERACTIVA PC PUMA</h1>
        <p id="status-message">Verificando compatibilidad con WebXR...</p>
        
        <div class="instructions">
            <p>🖐 Agarra objetos</p>
            <p>🎮 Muévelos</p>
            <p>🚀 Lánzalos</p>
        </div>

        <button id="btn-enter-vr" style="display: none;">🥽 ENTRAR EN EXPERIENCIA VR</button>
        <button id="btn-demo-pc" style="display: none;">💻 Modo Demo en PC</button>
    </div>

    <!-- UI VR Opcional flotante (overlay 2D) -->
    <div id="vr-overlay" style="display: none;">
        <div class="vr-panel">
            <h2>Estadísticas</h2>
            <p>Objetos lanzados: <span id="stat-thrown">0</span></p>
            <p>Objetos agarrados: <span id="stat-grabbed">0</span></p>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
